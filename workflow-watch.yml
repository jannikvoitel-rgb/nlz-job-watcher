name: Stellen prüfen

# Alle drei Stunden automatisch, zusätzlich jederzeit von Hand startbar.
on:
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Nur testen: keine Pushes, keine Dateiänderungen"
        type: boolean
        default: false
      verbose:
        description: "Ausführliche Logausgaben"
        type: boolean
        default: false

# Zwei Läufe gleichzeitig kämen sich beim Zurückschreiben in die Quere.
concurrency:
  group: stellen-pruefen
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  pruefen:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Repo auschecken
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-playwright.txt

      - name: Abhängigkeiten installieren
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt -r requirements-playwright.txt

      # Chromium ist rund 150 MB. Der Cache spart den Download bei jedem Lauf.
      - name: Browser aus dem Cache holen
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements-playwright.txt') }}

      - name: Chromium installieren
        run: python -m playwright install --with-deps chromium

      # Erst die Tests: ist die Einstufung oder ein Adapter kaputt, wird gar
      # nicht erst gescrapt.
      - name: Tests
        run: python -m pytest

      - name: Stellen abrufen
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
          WATCHER_CONTACT: ${{ secrets.WATCHER_CONTACT }}
          PYTHONPATH: src
        run: |
          ARGS=""
          if [ "${{ inputs.dry_run }}" = "true" ]; then ARGS="$ARGS --dry-run"; fi
          if [ "${{ inputs.verbose }}" = "true" ]; then ARGS="$ARGS --verbose"; fi
          python -m nlzwatch $ARGS

      - name: Änderungen zurückschreiben
        if: ${{ inputs.dry_run != true }}
        env:
          PYTHONPATH: src
        run: |
          if [ -z "$(git status --porcelain data docs/data)" ]; then
            echo "Keine neuen oder geänderten Stellen - nichts zu committen."
            exit 0
          fi
          OFFEN=$(python -c "import json; d=json.load(open('data/jobs.json')); print(sum(1 for j in d['jobs'] if j['status']=='offen'))")
          GLB=$(python -c "import json; d=json.load(open('data/jobs.json')); print(sum(1 for j in d['jobs'] if j['status']=='offen' and j['priority']=='A'))")
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/jobs.json docs/data/jobs.json
          git commit -m "Stellen aktualisiert: ${OFFEN} offen, davon ${GLB} im GLB"
          # Falls nebenher etwas committet wurde, erst aufsetzen, dann schieben.
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"

      - name: Zusammenfassung schreiben
        if: always()
        env:
          PYTHONPATH: src
        run: |
          if [ -f data/jobs.json ]; then
            python -m nlzwatch --report >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Noch keine Daten vorhanden." >> "$GITHUB_STEP_SUMMARY"
          fi
