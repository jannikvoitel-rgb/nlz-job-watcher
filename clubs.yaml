# Zu ueberwachende Vereine.
#
# Einen neuen Verein ergaenzt man ausschliesslich hier. Nur wenn ein Verein ein
# Portal nutzt, das noch keinen Adapter hat, kommt ein kleiner neuer Adapter in
# src/nlzwatch/adapters/ dazu.
#
# Felder pro Quelle:
#   id          eindeutiger Schluessel (stabil lassen, steckt in den Job-IDs)
#   label       Anzeigename der Quelle in der Web-App
#   adapter     softgarden | personio | hrworks | generic_html | successfactors | js_generic
#   url         Startseite der Stellenliste
#   enabled     false = Quelle wird uebersprungen (Adapter noch nicht gebaut)
#   params      adapterspezifische Parameter
#   empty_ok    Textmuster, die eine legitim leere Seite belegen (kein Fehler)
#
# speculative: Initiativbewerbung. allowed: yes | no | limited | unknown
#
# keywords: optionale vereinsspezifische Schlagwoerter. Werden VOR den globalen
# Listen aus filters.yaml geprueft, je Stufe priority_a / priority_b / priority_c.
# Gedacht fuer Eigennamen, die nur dieser Verein benutzt:
#     keywords:
#       priority_a:
#         - knappenkicker      # hiesse: Stelle im Grundlagenbereich
#       priority_c:
#         - fanshop-name

defaults:
  # Hoeflichkeits-Einstellungen, greifen fuer alle Quellen
  request_delay_seconds: 1.5
  timeout_seconds: 25
  retries: 3
  respect_robots: true

clubs:
