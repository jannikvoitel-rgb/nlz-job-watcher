  # ---------------------------------------------------------------- 3
  - name: FC Bayern München
    short: fcbayern
    sources:
      - id: fcbayern-successfactors
        label: Jobportal
        adapter: successfactors
        url: https://careers.fcbayern.com/go/Alle-Jobangebote-anzeigen/8774701/
        enabled: false
        manual: true
        manual_reason: >-
          Die Seite weist automatisierte Zugriffe ab und liefert auch einem
          echten Browser eine Fehlerseite statt der Stellen. Daran vorbei
          zu kommen hieße, die Bot-Erkennung zu täuschen – das ist hier
          bewusst nicht gebaut.
        manual_hint: >-
          Das Jobportal des FC Bayern (SAP SuccessFactors) hat eine eigene
          Benachrichtigungsfunktion: im Portal unter „Benachrichtigung
          erstellen“ eintragen, dann kommen neue Stellen per E-Mail direkt
          vom Verein. Zusätzlich lässt sich ein Bewerberprofil für
          zukünftige Stellen anlegen.
        params:
          # Falls der Verein die Sperre je lockert: SuccessFactors blaettert
          # ueber ?startrow=25 in Schritten von 25 Eintraegen.
          needs_browser: true
          pagination_param: startrow
          page_size: 25
    speculative:
      allowed: yes
      note: "Talent-Pool: Profil für zukünftige Jobs anlegen. Zusätzlich eigener Job-Alert im Portal."
      url: https://careers.fcbayern.com/

  # ---------------------------------------------------------------- 4
  - name: TSG Hoffenheim
    short: tsg
    sources:
      - id: tsg-stellenangebote
        label: Stellenangebote
        adapter: js_generic
        url: https://www.tsg-hoffenheim.de/tsg/karriere/stellenangebote
        # Vom eigenen Rechner aus laedt die Seite einwandfrei, aus GitHubs
        # Rechenzentrum antwortet sie mit "403 Forbidden" - zweimal in Folge
        # geprueft. Die Stellen sind oeffentlich, nur automatisierte Zugriffe
        # von dort werden abgewiesen.
        enabled: false
        manual: true
        manual_reason: >-
          Die Seite antwortet den GitHub-Rechnern mit „403 Forbidden“, auch
          einem echten Browser. Vom eigenen Rechner aus lädt sie normal. Daran
          vorbei zu kommen hieße, die Herkunft zu verschleiern – das ist hier
          bewusst nicht gebaut.
        manual_hint: >-
          Zwei Wege: die Seite gelegentlich selbst aufrufen, oder den Abruf
          vom eigenen Rechner starten mit „python -m nlzwatch --club tsg
          --include-manual“. Das schreibt die Stellen in jobs.json, ein Commit
          bringt sie in die App. Die hier gespeicherten Stellen stammen vom
          letzten erfolgreichen Abruf und können veraltet sein.
        params:
          needs_browser: true
          # Die Liste wird per AngularJS nachgeladen (ng-repeat).
          item: 'div.g-box:has(a[href*="/stellenangebote/detail/"])'
          title: "h5.name"
          link: 'a[href*="/stellenangebote/detail/"]'
          employment_type: ".labels p.t"
          location: ".loc p"
          wait_for: 'a[href*="/stellenangebote/detail/"]'
          # Angular liefert Links der Form "./tsg/karriere/..." - die sind
          # gegen die Seitenwurzel aufzuloesen, sonst entsteht ein doppelter
          # Pfad und die Seite antwortet mit 403.
          link_relative_to: root
          detail_root: ".content-box .body"
          # Die Seite schreibt bei null Stellen KEIN "keine offenen Stellen" hin.
          # Beleg fuer korrektes Laden ist daher der Ansprechpartner-Block.
          loaded_marker: "Ansprechpartner"
    speculative:
      allowed: limited
      note: "Laut FAQ nur geringe Aussicht auf Erfolg. Ansprechpartner: Matilde Florentino und Noelle Herbst (Nachwuchsbereich), Robin Wenzel (Fußballschule)."
      url: https://www.tsg-hoffenheim.de/tsg/karriere/bewerbung

