  # ---------------------------------------------------------------- 13
  - name: Hamburger SV
    short: hsv
    sources:
      # Der HSV betreibt zwei Personio-Boards, die sich die Stellen
      # aufteilen: Festanstellungen auf hsv-fussball-ag, Aushilfen und
      # Praktika auf hsv-fussball-ag-ap. Beide zusammen ergeben genau die
      # 12 Stellen des Mandanten, ohne Ueberschneidung.
      #
      # Der XML-Feed von hsv-fussball-ag listet zwar alle 12, aber die
      # Detailseiten der 9 Aushilfen-Stellen antworten auf diesem Host mit
      # 404 - sie liegen nur unter dem -ap-Host. Deshalb hier bewusst
      # prefer_xml: false und zwei Quellen.
      - id: hsv-ag-personio
        label: HSV Fußball AG
        adapter: personio
        url: https://hsv-fussball-ag.jobs.personio.de/
        enabled: true
        params:
          prefer_xml: false
      - id: hsv-ap-personio
        label: Aushilfsjobs und Praktika
        adapter: personio
        url: https://hsv-fussball-ag-ap.jobs.personio.de/
        enabled: true
        params:
          prefer_xml: false
      - id: hsv-ev
        label: HSV e.V.
        adapter: generic_html
        url: https://www.hsv.de/jobs-beim-e-v
        enabled: true
        params:
          # Die Seite hat keine sprechenden Klassen, nur Utility-Klassen.
          # Die Stellen sind Aufklapp-Elemente; "text-hsv-navy" grenzt sie
          # vom Navigationsmenue ab, das dieselbe Struktur nutzt.
          item: "div:has(> button.text-hsv-navy)"
          title: "button span"
          description: "button + div"
    speculative:
      allowed: no
      note: "Nimmt keine Initiativbewerbungen entgegen. Kontakt e.V.: personal-ev@hsv.de"
      url: https://www.hsv.de/karriere

