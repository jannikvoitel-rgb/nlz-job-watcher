# Relevanz-Einstufung fuer alle Vereine.
#
# Ablauf der Pruefung (erste Regel, die greift, gewinnt):
#   1. Prioritaet A: Grundlagenbereich-Schlagwort oder Altersklasse U8-U11
#   2. Prioritaet B: klares Sport-Schlagwort in Titel oder Abteilung
#   3. Prioritaet C: klares Nicht-Sport-Schlagwort in Titel oder Abteilung
#   4. Rest: Prioritaet B (unsichere Faelle bewusst hoeher eingestuft)
#
# Umlaute bitte normal schreiben (Förderkader, Übungsleiter).
# Vergleich ist unabhaengig von Gross-/Kleinschreibung und Umlauten:
# "Fussballschule" trifft "Fußballschule", "U 10" trifft "U10" und "U-10".

# --- Prioritaet A: Grundlagenbereich (GLB) --------------------------------
priority_a:
  label: "GLB"
  description: "Grundlagenbereich U8-U11"

  # Schlagwoerter, die allein schon A ausloesen
  keywords:
    - grundlagenbereich
    - grundlagentraining
    - grundlagenbereichstrainer
    - bambini
    - f-jugend
    - e-jugend
    - f-/e-jugend
    - e-/f-jugend
    - f- und e-jugend
    - f-junioren
    - e-junioren
    - fussballschule
    - fussballcamp
    - fussballcamps
    - kinderfussball
    - kinderfussballtrainer
    - minikicker
    - talentförderung
    - talentförderprogramm
    - förderkader
    - future kids
    - camptrainer
    - campustraining
    - campus training

  # Altersklassen, die A ausloesen. Werden als eigenstaendige Tokens geprueft,
  # "U16" loest also kein "U1" aus.
  age_groups:
    - u8
    - u9
    - u10
    - u11

  # A-Treffer nur in der Beschreibung (nicht im Titel) zaehlen ausschliesslich,
  # wenn der Titel wenigstens einen dieser Sportbezuege hat. Verhindert, dass
  # eine Marketingstelle A wird, weil im Text ein U10-Turnier erwaehnt wird.
  description_requires_title_signal:
    - trainer
    - trainerin
    - coach
    - übungsleiter
    - übungsleiterin
    - nachwuchs
    - nlz
    - leistungszentrum
    - akademie
    - fussball
    - talent
    - sport

