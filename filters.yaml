# --- Push-Verhalten ------------------------------------------------------
push:
  priority_a:
    ntfy_priority: high
    title_template: "⚽ GLB-Stelle: {club}"
    tags: ["soccer"]
    bundle: false          # A-Stellen immer als eigene Nachricht
  priority_b:
    ntfy_priority: default
    title_template: "Neue Sportstelle: {club}"
    tags: ["briefcase"]
    bundle: true           # mehrere B-Stellen eines Laufs zusammenfassen
  priority_c:
    push: false            # wird nur gespeichert, nicht gepusht

# --- Eintraege, die keine Stelle sind -----------------------------------
# Portale fuehren Dauer-Eintraege in der Stellenliste. Die werden nicht als
# Stelle gezaehlt und nicht gepusht.
ignore_titles:
  - initiativbewerbung
  - initiativ-bewerbung
  - unaufgeforderte bewerbung
  - talentpool
  - talent pool
  - talentnetzwerk
  - kandidatenpool
  - newsletter
  - stellenabo
  - jobalarm
  - job alert
  - speculative application
  - unsolicited application

# Welche dieser Eintraege belegen eine Initiativbewerbungs-Moeglichkeit?
# Wird in der Web-App beim Verein als Link angezeigt.
speculative_titles:
  - initiativbewerbung
  - initiativ-bewerbung
  - unaufgeforderte bewerbung
  - talentpool
  - talent pool
  - kandidatenpool

# --- Fehlerueberwachung -------------------------------------------------
monitoring:
  # Warnung, wenn eine Quelle ploetzlich gar keine Stellen mehr liefert
  # (vorher >0) und die Seite das nicht selbst als "nichts offen" ausweist.
  warn_on_empty: true
  # Zusaetzlich warnen, wenn die Zahl um diesen Anteil einbricht. Faengt den
  # Fall, dass ein Portal nur noch einen Teil ausliefert - etwa wenn ein
  # XML-Feed ausfaellt und der HTML-Rueckfall weniger Stellen zeigt.
  warn_on_drop_ratio: 0.6
  # Unter dieser Stellenzahl ist ein Einbruch nicht aussagekraeftig.
  drop_min_previous: 5

# "NEU"-Badge in der Web-App
new_badge_days: 7
